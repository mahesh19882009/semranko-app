services:
  postgres:
    image: postgres:16
    container_name: rankcare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rankcare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rankcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: rankcare_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./fastapi_app
    container_name: rankcare_fastapi_api
    restart: unless-stopped
    environment:
      APP_NAME: RankCare API
      ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/rankcare
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_ACCESS_SECRET: replace-with-a-secure-secret
      JWT_ACCESS_EXPIRES_IN_DAYS: 1
      FRONTEND_URL: http://localhost:3000
      DATAFORSEO_LOGIN: mahesh1988.2009@gmail.com
      DATAFORSEO_PASSWORD: ca0dbcc1f131b2a7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    command: ["python", "run.py"]

  worker:
    build:
      context: ./fastapi_app
    container_name: rankcare_fastapi_worker
    restart: unless-stopped
    environment:
      APP_NAME: RankCare API
      ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/rankcare
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_ACCESS_SECRET: replace-with-a-secure-secret
      JWT_ACCESS_EXPIRES_IN_DAYS: 1
      FRONTEND_URL: http://localhost:3000
      DATAFORSEO_LOGIN: mahesh1988.2009@gmail.com
      DATAFORSEO_PASSWORD: ca0dbcc1f131b2a7
      PINGBACK_URL: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.workers.rank_worker"]

volumes:
  pgdata: